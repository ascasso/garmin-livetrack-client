plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation libs.jackson.databind
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter('6.1.0')

            dependencies {
                implementation libs.assertj.core
            }
        }

        integrationTest(JvmTestSuite) {
            useJUnitJupiter('6.1.0')

            dependencies {
                implementation project()
                implementation libs.assertj.core
            }

            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(test)
                        systemProperty 'garmin.livetrack.sessionUrl', providers.environmentVariable('GARMIN_LIVETRACK_SESSION_URL').orNull
                        systemProperty 'garmin.livetrack.profileName', providers.environmentVariable('GARMIN_LIVETRACK_PROFILE_NAME').orNull
                    }
                }
            }
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}
